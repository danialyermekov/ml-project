[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "danial639", email = "danialrmkv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-project = "ml_project.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
